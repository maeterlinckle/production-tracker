<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Production Tracker">
    <!--
        The same mark the application already wears in its own header: a rounded
        accent tile with PT on it, at the same 26% corner radius as .brand-mark
        in app.css. A tab icon that disagrees with the logo above it is two
        identities for one tool.

        Drawn as rectangles rather than <text>, because a favicon is rendered
        outside the page and cannot rely on a font being there — substitution
        would give a different mark on every machine.

        Colours track the viewer's theme so the tile stays legible against dark
        browser chrome, using the same tokens as the stylesheet: #1d4ed8 on
        white for light, #60a5fa on near-black for dark.
    -->
    <style>
        .tile { fill: #1d4ed8; }
        .mark { fill: #ffffff; }
        @media (prefers-color-scheme: dark) {
            .tile { fill: #60a5fa; }
            .mark { fill: #06152e; }
        }
    </style>

    <rect class="tile" width="64" height="64" rx="17"/>

    <g class="mark">
        <!-- P -->
        <rect x="12" y="18" width="6" height="28"/>
        <rect x="12" y="18" width="16" height="6"/>
        <rect x="12" y="28" width="16" height="6"/>
        <rect x="22" y="18" width="6" height="16"/>
        <!-- T -->
        <rect x="34" y="18" width="18" height="6"/>
        <rect x="40" y="18" width="6" height="28"/>
    </g>
</svg>
